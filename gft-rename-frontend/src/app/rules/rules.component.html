<div class="rules-container">
  <div class="rules-header">
    <h2>Rename Rules</h2>
    <button class="btn-primary" title="Add new rule" (click)="openCreateRule()">
      <span class="icon">➕</span> Add Rule
    </button>
  </div>

  <div class="rules-list-wrapper">

    <div
      class="rules-list"
    >
      @for (rule of rules(); track rule.id) {
        <div class="rule-item">

          <div class="rule-content">
            <div class="rule-header">
              <h3 class="rule-name">{{ rule.name }}</h3>
            </div>
            <div class="rule-details">
              <div class="rule-detail">
                <span class="detail-label">Match:</span>
                <code class="detail-value">{{ rule.toCheck }}</code>
              </div>
              <div class="rule-detail">
                <span class="detail-label">Replace to:</span>
                <code class="detail-value">{{ rule.toReplace }}</code>
              </div>
            </div>
          </div>

          <div class="rule-actions">
            <button
              class="btn-icon"
              (click)="moveUp($index)"
              [disabled]="$index === 0"
              title="Move up"
            >
              ⬆️
            </button>
            <button
              class="btn-icon"
              (click)="moveDown($index)"
              [disabled]="$index === rules().length - 1"
              title="Move down"
            >
              ⬇️
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</div>
